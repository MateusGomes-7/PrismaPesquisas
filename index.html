<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prisma Pesquisas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box">

  <h1>Prisma Pesquisas Eleitorais</h1>
  <p>Sua opinião é importante.</p>

  <form id="form">

    <input type="text" id="name" placeholder="Seu nome" required>

    <input type="number" id="age" placeholder="Sua idade" required>

    <label><input type="radio" name="vote" value="Candidato 1" required> Candidato 1</label>

    <label><input type="radio" name="vote" value="Candidato 2"> Candidato 2</label>

    <label><input type="radio" name="vote" value="Candidato 3"> Candidato 3</label>

    <label><input type="radio" name="vote" value="Indeciso"> Indeciso</label>

    <button>Enviar</button>

  </form>

  <div id="msg">
    Resposta enviada!
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
